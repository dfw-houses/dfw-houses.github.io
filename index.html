        }

    <script type="application/ld+json" id="listing-schema"></script>

   <!-- robots.txt & sitemap.xml as Blob URLs -->
    <script>
      (() => {
        const origin = location.origin || "";
        const robotsContent = `User-agent: *\nAllow: /\nSitemap: ${origin}/sitemap.xml`;
        const robotsBlob = new Blob([robotsContent], { type: "text/plain" });
        const robotsURL = URL.createObjectURL(robotsBlob);
        const robotsLink = document.createElement("link");
        robotsLink.rel = "alternate";
        robotsLink.type = "text/plain";
        robotsLink.title = "robots.txt";
        robotsLink.href = robotsURL;
        document.head.appendChild(robotsLink);

        const urls = ["/", "/#listings", "/#blog", "/#about", "/#contact"];
        const sitemap = `<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<urlset xmlns=\"http://www.sitemaps.org/schemas/sitemap/0.9\">${urls
          .map((u) => `\n  <url><loc>${origin}${u}</loc></url>`)
          .join("")}\n</urlset>`;
        const siteBlob = new Blob([sitemap], { type: "application/xml" });
        const siteURL = URL.createObjectURL(siteBlob);
        const siteLink = document.createElement("link");
        siteLink.rel = "alternate";
        siteLink.type = "application/xml";
        siteLink.title = "sitemap.xml";
        siteLink.href = siteURL;
        document.head.appendChild(siteLink);
      })();
    </script>
